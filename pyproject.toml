[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polanalyser"
version = "3.1.1"
description = "Polarization image analysis tool"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ryota Maeda", email = "maeda.ryota.elerac@gmail.com" },
]
dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.5",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/elerac/polanalyser"

[project.optional-dependencies]
inference = ["huggingface-hub>=0.25", "onnxruntime>=1.23,<2"]
inference-cuda = ["huggingface-hub>=0.25", "onnxruntime-gpu[cuda,cudnn]>=1.23,<2"]
sympy = ["sympy"]

[tool.setuptools.packages.find]
include = ["polanalyser", "polanalyser.*"]
namespaces = false

[tool.uv]
conflicts = [[{ extra = "inference" }, { extra = "inference-cuda" }]]
